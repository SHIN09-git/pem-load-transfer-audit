name: Reproduce load-transfer analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit saved outputs
        run: python reproduce.py
      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt
      - name: Check numerical comparison safeguards
        run: python tests/test_reproduction.py
      - name: Refit models and regenerate figures
        run: python reproduce.py --mode analysis

